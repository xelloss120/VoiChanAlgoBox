# DeepFilterNet（AI のデノイズ）を C++ から使うための、小さなラッパー。
# 学習済みのモデル（DeepFilterNet3 約 8MB、低遅延版 約 36MB）を中に埋め込み、静的ライブラリにする（利用者向けの DLL は増えない）。
[package]
name = "vcab_dfn"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"

[features]
# 低遅延のモデル（DeepFilterNet3_ll、約 36MB）を埋め込む。環境変数 VCAB_DFN_LL_MODEL にモデルのファイルの場所を渡す
ll-model = []

[profile.release]
opt-level = 3
lto = "thin"
debug = false
